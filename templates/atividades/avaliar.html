{% extends "base.html" %}
{% block titulo %}Avaliar Atividade{% endblock %}

{% block conteudo %}
<div class="page-header">
  <h1 class="page-title">⭐ Avaliar: {{ atividade.nome }}</h1>
  <a href="{% url 'lista_atividades' %}" class="btn btn-secundario">← Voltar</a>
</div>

<div style="max-width: 400px; margin: 0 auto;">
  <div class="card">
    <p class="text-sm text-suave mb-2">A tua avaliação de 1 a 5 estrelas:</p>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-group">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
      </div>
      {% endfor %}
      <div class="d-flex gap-1">
        <button type="submit" class="btn btn-primario">Guardar avaliação</button>
        <a href="{% url 'lista_atividades' %}" class="btn btn-secundario">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<style>
  input[type="number"] { width: 100%; padding: 0.6rem 0.875rem; border: 1px solid var(--cor-borda); border-radius: var(--raio-borda-sm); font-size: 1.5rem; text-align: center; }
  input:focus { outline: none; border-color: var(--cor-primaria); }
</style>
{% endblock %}
