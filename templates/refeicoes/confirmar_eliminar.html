{% extends "base.html" %}
{% block titulo %}Confirmar eliminação{% endblock %}

{% block conteudo %}
<div style="max-width: 450px; margin: 3rem auto;">
  <div class="card" style="text-align: center; padding: 2rem;">
    <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
    <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">Eliminar {{ tipo }}?</h2>
    <p class="text-suave text-sm" style="margin-bottom: 1.5rem;">"{{ objeto }}" será eliminado permanentemente.</p>
    <div class="d-flex gap-1" style="justify-content: center;">
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-perigo">Eliminar</button>
      </form>
      <a href="{% url 'planeamento' %}" class="btn btn-secundario">Cancelar</a>
    </div>
  </div>
</div>
{% endblock %}
